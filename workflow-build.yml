name: Build TimeCastV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 🔑 Preparar firma fija
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/timecastv.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/timecastv.jks" >> "$GITHUB_ENV"
            echo "✅ Se firmará con la clave fija de TimeCastV"
          else
            echo "⚠️ No hay KEYSTORE_BASE64: se firmará con clave debug (solo pruebas)"
          fi

      - name: 🏗️ Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: ✏️ Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk TimeCastV.apk

      - name: 📦 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TimeCastV-APK
          path: TimeCastV.apk
          retention-days: 30
